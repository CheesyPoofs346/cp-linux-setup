# CyberPatriot Linux Auto Configuration

# OpenRouter API Configuration
# Get your API key from: https://openrouter.ai/
OPENROUTER_API_KEY=""

# Automatically select an available free model; no model selection needed.
# Free-model daily quotas are account-wide, not increased by changing models.
OPENROUTER_MODEL="openrouter/free"

# Log level: 0=DEBUG, 1=INFO, 2=WARN, 3=ERROR, 4=SUCCESS
LOG_LEVEL=1

# Switch to nvidia when you have its API key. No paid-provider fallback.
AI_PROVIDER="openrouter"
NVIDIA_API_KEY=""
NVIDIA_MODEL="nvidia/nemotron-3-super-120b-a12b"
AI_TIMEOUT_SECONDS=180

# Auto mode: 1 = APT configuration only; 2 = full package upgrade (same release).
AUTO_UPDATE_MODE=1
AUTO_MODULE_TIMEOUT=1800

# Optional SSH key installation. Use a PUBLIC key file, never a private key.
# Auto mode skips SSH hardening unless these are explicitly configured.
SSH_TARGET_USER=""
SSH_PUBLIC_KEY_FILE=""
SSH_PORT=22
