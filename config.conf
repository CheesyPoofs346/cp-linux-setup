# CyberPatriot Linux Auto Configuration

# OpenRouter API Configuration
# Get your API key from: https://openrouter.ai/
OPENROUTER_API_KEY=""

# Automatically select an available free model; no model selection needed.
# Free-model daily quotas are account-wide, not increased by changing models.
OPENROUTER_MODEL="openrouter/free"

# Log level: 0=DEBUG, 1=INFO, 2=WARN, 3=ERROR, 4=SUCCESS
LOG_LEVEL=1

# Switch to nvidia when you have its API key. No paid-provider fallback.
AI_PROVIDER="nvidia"
NVIDIA_API_KEY=""
NVIDIA_MODEL="z-ai/glm-5.3-flash"
AI_TIMEOUT_SECONDS=180

# Auto mode: 1 = APT configuration only; 2 = full package upgrade (same release).
AUTO_UPDATE_MODE=2
AUTO_MODULE_TIMEOUT=1800
# Auto remediation: 1 = execute full remediation suite (user auditing, policies, malware, etc.)
AUTO_REMEDIATE=1

# Optional SSH key installation. Use a PUBLIC key file, never a private key.
# Auto mode skips SSH hardening unless these are explicitly configured.
SSH_TARGET_USER=""
SSH_PUBLIC_KEY_FILE=""
SSH_PORT=22

# Forensics are investigated before cleanup. Only cited, verbatim evidence answers
# with matching ANSWER placeholders can be filled. Score acceptance is unverified.
FORENSICS_APPLY_ANSWERS=1
FORENSICS_MAX_ROUNDS=8
# Optional: directory containing question files (otherwise searches user Desktops).
FORENSICS_DIR=""
# Optional: image-specific answer-format notes; these do not authorize shell commands.
FORENSICS_IMAGE_NOTES=""

# Independent reviewer. Must differ from NVIDIA_MODEL. No silent model fallback.
REVIEWER_MODEL="nvidia/nemotron-3-super-120b-a12b"
# Normally inferred from sudo's SUDO_USER. Root-only launches must set this.
PROTECTED_USER=""
